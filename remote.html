<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#070913">
    <title>Pimax Smart Remote Pro</title>
    <!-- PeerJS WebRTC P2P Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-void: #070913;
            --card-glass: rgba(22, 26, 46, 0.68);
            --card-glass-hover: rgba(30, 36, 64, 0.78);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-light: rgba(255, 255, 255, 0.16);
            --accent-violet: #8B5CF6;
            --accent-indigo: #6366F1;
            --accent-glow: rgba(139, 92, 246, 0.45);
            --neon-blue: #38BDF8;
            --emerald-green: #10B981;
            --coral-red: #F43F5E;
            --amber-gold: #F59E0B;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 85% 12%, rgba(139, 92, 246, 0.22) 0%, transparent 45%),
                        radial-gradient(circle at 15% 75%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, #0d1222 0%, #070913 85%);
            background-color: var(--bg-void);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px calc(env(safe-area-inset-bottom, 20px) + 24px) 16px;
            gap: 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Glassmorphism Bento Card */
        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glass);
            border-radius: 26px;
            padding: 16px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12),
                        0 16px 36px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Top Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 22px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .brand-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-icon {
            color: var(--accent-violet);
            display: flex;
            align-items: center;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, #FFFFFF 30%, #C4B5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-pin-pill {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-pin-pill b {
            color: var(--neon-blue);
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--amber-gold);
            box-shadow: 0 0 10px currentColor;
            transition: all 0.3s ease;
        }

        .power-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.35);
            color: #FDA4AF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(244, 63, 94, 0.25);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .power-btn:active {
            transform: scale(0.92);
            background: rgba(244, 63, 94, 0.35);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
        }

        /* ================= D-PAD PRO TOUCHPAD ================= */
        .dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
        }

        .dpad-outer-wheel {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(30, 36, 68, 0.75) 0%, rgba(14, 18, 36, 0.9) 100%);
            border: 1px solid var(--border-glass-light);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.12),
                        inset 0 -4px 10px rgba(0, 0, 0, 0.6),
                        0 20px 45px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(99, 102, 241, 0.12);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-arrow {
            position: absolute;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            transition: all 0.15s ease;
            z-index: 2;
        }

        .dpad-arrow:active {
            color: #FFFFFF;
            transform: scale(0.92);
            background: rgba(139, 92, 246, 0.25);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.4);
        }

        .dpad-arrow.up    { top: 6px; left: calc(50% - 34px); }
        .dpad-arrow.down  { bottom: 6px; left: calc(50% - 34px); }
        .dpad-arrow.left  { left: 6px; top: calc(50% - 34px); }
        .dpad-arrow.right { right: 6px; top: calc(50% - 34px); }

        .dpad-center-ok {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 50%, #4F46E5 100%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4),
                        0 8px 24px var(--accent-glow),
                        0 0 35px rgba(139, 92, 246, 0.35);
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dpad-center-ok:active {
            transform: scale(0.91);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4),
                        0 4px 16px var(--accent-glow);
            filter: brightness(1.15);
        }

        /* ================= CORE ACTION BUTTONS ================= */
        .controls-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .controls-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .action-tile {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 12px 6px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.2px;
            transition: all 0.16s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .action-tile svg {
            color: var(--text-secondary);
            transition: all 0.16s ease;
        }

        .action-tile:active {
            transform: scale(0.93);
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(139, 92, 246, 0.45);
        }

        .action-tile:active svg {
            color: #FFFFFF;
            filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.6));
        }

        /* Mute active state */
        .action-tile.mute-active {
            background: rgba(244, 63, 94, 0.2);
            border-color: rgba(244, 63, 94, 0.4);
            color: #FDA4AF;
        }
        .action-tile.mute-active svg {
            color: var(--coral-red);
        }

        /* ================= BENTO SMART HUB: KHÓA TRẺ EM & HẸN GIỜ ================= */
        .bento-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Khóa Trẻ Em Card */
        .child-lock-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(135deg, rgba(28, 22, 54, 0.75) 0%, rgba(20, 24, 46, 0.65) 100%);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .card-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon-badge {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.2);
            color: #C4B5FD;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(139, 92, 246, 0.35);
        }

        .card-texts {
            display: flex;
            flex-direction: column;
        }

        .card-main-title {
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .card-sub-title {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* iOS Switch Toggle */
        .ios-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .ios-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .ios-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.16);
            transition: .25s ease;
            border-radius: 999px;
            border: 1px solid var(--border-glass);
        }

        .ios-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 2px;
            background-color: white;
            transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .ios-switch input:checked + .ios-slider {
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-indigo));
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .ios-switch input:checked + .ios-slider:before {
            transform: translateX(20px);
        }

        /* PIN Quick Unlock Row */
        .pin-unlock-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .glass-input-sm {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass-light);
            border-radius: 12px;
            padding: 8px 12px;
            color: #FFFFFF;
            font-size: 12.5px;
            font-family: monospace;
            letter-spacing: 1.5px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .glass-input-sm:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
        }

        .btn-violet-sm {
            padding: 8px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-indigo));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
            white-space: nowrap;
        }

        .btn-violet-sm:active {
            transform: scale(0.94);
        }

        /* Hẹn giờ tắt máy Card */
        .sleep-timer-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(135deg, rgba(22, 28, 54, 0.75) 0%, rgba(16, 20, 40, 0.65) 100%);
            border: 1px solid rgba(56, 189, 248, 0.18);
        }

        .timer-countdown-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--neon-blue);
            background: rgba(56, 189, 248, 0.15);
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .timer-pills-wrap {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .timer-pills-wrap::-webkit-scrollbar {
            display: none;
        }

        .timer-pill {
            flex: 1;
            min-width: 58px;
            padding: 8px 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .timer-pill:active {
            transform: scale(0.93);
        }

        .timer-pill.active {
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            border-color: rgba(255, 255, 255, 0.35);
            color: #FFFFFF;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.45);
        }

        /* ================= WALLPAPER STUDIO CARD ================= */
        .wallpaper-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(135deg, rgba(30, 22, 60, 0.75) 0%, rgba(20, 24, 46, 0.65) 100%);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 16px 36px rgba(168, 85, 247, 0.12);
        }

        .wallpaper-upload-btn {
            width: 100%;
            padding: 13px 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 50%, #3B82F6 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wallpaper-upload-btn:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .wallpaper-status-note {
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* ================= INPUT & QUICK APPS ================= */
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .remote-text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass-light);
            border-radius: 16px;
            padding: 12px 14px;
            color: #FFFFFF;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .remote-text-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-violet);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.3);
        }

        .btn-send {
            padding: 12px 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-indigo));
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .btn-send:active {
            transform: scale(0.93);
        }

        /* Quick App Badges */
        .apps-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .app-pill {
            padding: 10px 8px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .app-pill:active {
            transform: scale(0.94);
        }

        .app-pill.yt  { background: rgba(239, 68, 68, 0.18); color: #FCA5A5; border-color: rgba(239, 68, 68, 0.35); }
        .app-pill.nf  { background: rgba(229, 9, 20, 0.18); color: #F87171; border-color: rgba(229, 9, 20, 0.35); }
        .app-pill.sp  { background: rgba(34, 197, 94, 0.18); color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }

    </style>
</head>
<body>
    <div class="container">

        <!-- 1. TOP HEADER -->
        <div class="glass-card header-bar">
            <div class="brand-info">
                <div class="brand-title-wrap">
                    <span class="brand-logo-icon">
                        <!-- TV SVG Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="15" x="2" y="7" rx="3"/>
                            <polyline points="17 2 12 7 7 2"/>
                        </svg>
                    </span>
                    <span class="brand-name">Pimax TV Remote</span>
                </div>
                <div class="brand-pin-pill">
                    Mã TV: <b id="pin-display">8899</b>
                </div>
            </div>

            <div class="header-actions">
                <div class="status-pill" id="conn-status-pill">
                    <span class="status-dot" id="conn-dot"></span>
                    <span id="conn-status-text">Đang kết nối...</span>
                </div>

                <!-- Nút Nguồn -->
                <button class="power-btn" onclick="sendCmd('POWER_TOGGLE')" title="Bật/Tắt chế độ chờ">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                        <line x1="12" y1="2" x2="12" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 2. D-PAD PRO TOUCHPAD CONTROLLER -->
        <div class="glass-card dpad-container">
            <div class="dpad-outer-wheel">
                <!-- Lên -->
                <button class="dpad-arrow up" onclick="sendCmd('KEY_UP')" aria-label="Lên">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15"/>
                    </svg>
                </button>

                <!-- Trái -->
                <button class="dpad-arrow left" onclick="sendCmd('KEY_LEFT')" aria-label="Trái">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>

                <!-- Nút OK Ở Tâm -->
                <button class="dpad-center-ok" onclick="sendCmd('KEY_ENTER')" aria-label="Xác nhận OK">
                    OK
                </button>

                <!-- Phải -->
                <button class="dpad-arrow right" onclick="sendCmd('KEY_RIGHT')" aria-label="Phải">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>

                <!-- Xuống -->
                <button class="dpad-arrow down" onclick="sendCmd('KEY_DOWN')" aria-label="Xuống">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 3. HÀNG ĐIỀU HƯỚNG CỐT LÕI (Core Navigation) -->
        <div class="controls-grid-4">
            <!-- Quay lại -->
            <button class="action-tile" onclick="sendCmd('KEY_BACK')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 14 4 9l5-5"/>
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
                </svg>
                <span>Quay lại</span>
            </button>

            <!-- Trang chủ -->
            <button class="action-tile" onclick="sendCmd('KEY_HOME')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Trang chủ</span>

            <!-- Menu / Control Center -->

            <button class="action-tile" onclick="sendCmd('OPEN_SETTINGS')">

                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

        <!-- 4. ÂM LƯỢNG & MEDIA -->
        <div class="controls-grid-3">

        <div class="controls-grid-3">

            <button class="action-tile" onclick="sendCmd('PREV_TRACK')">

            <!-- Bài kế -->
            <button class="action-tile" onclick="sendCmd('NEXT_TRACK')">

        <!-- 5. TÍNH NĂNG MỚI: KHÓA TRẺ EM (CHILD LOCK BENTO CARD) -->
        <div class="glass-card child-lock-card">
            <div class="card-row-header">
                <div class="card-title-group">
                    <div class="card-icon-badge">
                        <!-- Shield Check SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <path d="m9 12 2 2 4-4"/>
                        </svg>
                    </div>
                    <div class="card-texts">
                        <span class="card-main-title">Khóa Trẻ Em</span>

                <label class="ios-switch">

            <!-- Mở khóa PIN nhanh -->

            </div>
        </div>

        <!-- 6. TÍNH NĂNG MỚI: HẸN GIỜ TẮT MÁY (SLEEP TIMER BENTO CARD) -->
        <div class="glass-card sleep-timer-card">
            <div class="card-row-header">
                <div class="card-title-group">
                    <div class="card-icon-badge" style="background: rgba(56, 189, 248, 0.18); color: var(--neon-blue); border-color: rgba(56, 189, 248, 0.35);">
                        <!-- Moon & Clock SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                    </div>
                    <div class="card-texts">
                        <span class="card-main-title">Hẹn Giờ Tắt Máy</span>
                        <span class="card-sub-title">Tự động đưa TV vào chế độ chờ</span>
                    </div>
                </div>

                <!-- Đồng hồ đếm ngược -->
                <div class="timer-countdown-badge" id="timer-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="timer-badge-text">Chưa bật</span>
                </div>
            </div>

            <!-- Các nút viên thuốc chọn số phút -->
            <div class="timer-pills-wrap">
                <button class="timer-pill" onclick="selectSleepTimer(15, this)">15p</button>
                <button class="timer-pill" onclick="selectSleepTimer(30, this)">30p</button>
                <button class="timer-pill" onclick="selectSleepTimer(60, this)">60p</button>
                <button class="timer-pill" onclick="selectSleepTimer(120, this)">120p</button>
                <button class="timer-pill" onclick="selectSleepTimer(0, this)">Tắt</button>
            </div>
        </div>

        <!-- 7. GỬI ẢNH LÀM HÌNH NỀN TV 4K (WALLPAPER STUDIO) -->
        <div class="glass-card wallpaper-card">
            <div class="card-row-header">
                <div class="card-title-group">
                    <div class="card-icon-badge" style="background: rgba(168, 85, 247, 0.2); color: #E9D5FF; border-color: rgba(168, 85, 247, 0.35);">
                        <!-- Image Gallery SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                            <circle cx="9" cy="9" r="2"/>
                            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                        </svg>
                    </div>
                    <div class="card-texts">
                        <span class="card-main-title">Hình Nền TV (Wallpaper Hub)</span>
                        <span class="card-sub-title">Chọn nhiều ảnh, gửi không giới hạn</span>
                    </div>
                </div>
            </div>

            <label class="wallpaper-upload-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span>Chọn ảnh từ điện thoại để gửi lên TV</span>
                <input type="file" accept="image/*" multiple style="display:none;" onchange="handleSelectPhotos(event)">
            </label>

            <div class="wallpaper-status-note" id="upload-status">
                Tự động tối ưu 4K và truyền P2P tức thì qua WebRTC
            </div>
        </div>

        <!-- 8. NHẬP VĂN BẢN & MỞ NHANH APP -->
        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
            <div class="input-row">
                <input type="text" id="text-input" class="remote-text-input" placeholder="Gõ chữ, tìm kiếm hoặc lời chào..." onkeydown="if(event.key==='Enter') sendText()">
                <button class="btn-send" onclick="sendText()">Gửi</button>
            </div>

            <div class="apps-row">
                <div class="app-pill yt" onclick="sendCmd('LAUNCH_APP', 'YouTube')">YouTube</div>
                <div class="app-pill nf" onclick="sendCmd('LAUNCH_APP', 'Netflix')">Netflix</div>
                <div class="app-pill sp" onclick="sendCmd('LAUNCH_APP', 'Spotify')">Spotify</div>
            </div>
        </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. Phân tích tham số PIN từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetPin = urlParams.get('pin') || urlParams.get('room') || '8899';
        document.getElementById('pin-display').textContent = targetPin;

        let phonePeer = null;
        let activeConn = null;
        let isConnected = false;
        let isMuted = false;
        let sleepTimerSec = 0;
        let sleepTimerInterval = null;

        const statusPill = document.getElementById('conn-status-pill');
        const statusDot = document.getElementById('conn-dot');
        const statusText = document.getElementById('conn-status-text');

        function updateStatus(text, color, isOnline = true) {
            statusText.textContent = text;
            statusDot.style.background = color;
            statusDot.style.boxShadow = `0 0 10px ${color}`;
            if (isOnline) {
                statusPill.style.borderColor = color + '55';
            }
        }

        // 2. Khởi tạo PeerJS WebRTC P2P
        function initPeerConnection() {
            if (typeof Peer === 'undefined') {
                updateStatus('Chế độ Cloud Relay', '#38BDF8');
                return;
            }

            try {
                phonePeer = new Peer({
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:global.stun.twilio.com:3478' }
                        ]
                    }
                });

                phonePeer.on('open', () => {
                    connectToTv();
                });

                phonePeer.on('error', (err) => {
                    console.warn('Phone Peer error:', err);
                });
            } catch (err) {
                console.error('Peer init failed:', err);
            }
        }

        function connectToTv() {
            if (!phonePeer || !targetPin) return;
            updateStatus('Đang kết nối TV...', '#F59E0B');

            const targetTvId = 'pimax-tv-' + targetPin;
            activeConn = phonePeer.connect(targetTvId, { reliable: true });

            activeConn.on('open', () => {
                isConnected = true;
                updateStatus('Đã kết nối TV', '#10B981');
            });

            activeConn.on('close', () => {
                isConnected = false;
                activeConn = null;
                updateStatus('Mất kết nối TV', '#F59E0B');
                setTimeout(connectToTv, 2500);
            });
        }

        // 3. Gửi lệnh điều khiển (WebRTC P2P + Cloud Relay dự phòng)
        function sendCmd(cmd, payload = '') {
            const msg = { cmd, payload, t: Date.now() };

            // Rung phản hồi xúc giác
            if (navigator.vibrate) {
                navigator.vibrate(22);
            }

            let sentViaPeer = false;
            if (activeConn && activeConn.open) {
                try {
                    activeConn.send(msg);
                    sentViaPeer = true;
                } catch (e) {}
            }

            // Gửi qua Cloud Broker khi không phải ảnh nặng
            if (cmd !== 'SET_WALLPAPER') {
                fetch(`https://ntfy.sh/pimax_tv_remote_${targetPin}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(msg)
                }).then(() => {
                    if (!sentViaPeer) {
                        updateStatus('Đã kết nối qua Cloud', '#10B981');
                    }
                }).catch(() => {});
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            sendCmd('MUTE_TOGGLE');
            const tile = document.getElementById('mute-tile');
            const label = document.getElementById('mute-label');
            if (tile) tile.classList.toggle('mute-active', isMuted);
            if (label) label.textContent = isMuted ? 'Đã tắt tiếng' : 'Tắt tiếng';
        }

        function sendText() {
            const inp = document.getElementById('text-input');
            if (!inp || !inp.value.trim()) return;
            sendCmd('SEND_TEXT', inp.value.trim());
            inp.value = '';
        }

        // 4. KHÓA TRẺ EM TRÊN REMOTE
        function handleChildLockToggle(checked) {
            if (checked) {
                sendCmd('LOCK_TV');
            } else {
                const pin = document.getElementById('remote-pin-input').value.trim() || '0000';
                sendCmd('UNLOCK_TV', pin);
            }
        }

        function sendPinUnlock() {
            const pinInp = document.getElementById('remote-pin-input');
            const pinVal = pinInp ? pinInp.value.trim() : '';
            sendCmd('UNLOCK_TV', pinVal);
            if (pinInp) pinInp.value = '';
            document.getElementById('child-lock-toggle').checked = false;
        }

        // 5. HẸN GIỜ TẮT MÁY TRÊN REMOTE
        function selectSleepTimer(mins, btnEl) {
            document.querySelectorAll('.timer-pill').forEach(b => b.classList.remove('active'));
            if (btnEl && mins > 0) btnEl.classList.add('active');

            clearInterval(sleepTimerInterval);
            const badgeText = document.getElementById('timer-badge-text');

            if (mins <= 0) {
                sleepTimerSec = 0;
                badgeText.textContent = 'Chưa bật';
                sendCmd('SET_SLEEP_TIMER', '0');
                return;
            }

            sleepTimerSec = mins * 60;
            sendCmd('SET_SLEEP_TIMER', String(mins));
            updateTimerDisplay();

            sleepTimerInterval = setInterval(() => {
                sleepTimerSec--;
                if (sleepTimerSec <= 0) {
                    clearInterval(sleepTimerInterval);
                    badgeText.textContent = 'Đã tắt máy';
                    document.querySelectorAll('.timer-pill').forEach(b => b.classList.remove('active'));
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = String(Math.floor(sleepTimerSec / 60)).padStart(2, '0');
            const s = String(sleepTimerSec % 60).padStart(2, '0');
            document.getElementById('timer-badge-text').textContent = `Còn ${m}:${s}`;
        }

        // 6. GỬI NHIỀU ẢNH LÀM HÌNH NỀN TV (KHÔNG GIỚI HẠN)
        async function handleSelectPhotos(event) {
            const files = event.target.files;
            if (!files || !files.length) return;

            const statusEl = document.getElementById('upload-status');
            const total = files.length;
            statusEl.textContent = `Đang xử lý ${total} ảnh...`;
            statusEl.style.color = '#38BDF8';

            if (!activeConn || !activeConn.open) {
                alert('Tivi chưa kết nối trực tiếp P2P! Hãy đợi 2 giây để kết nối hoàn tất rồi gửi ảnh nhé.');
                statusEl.textContent = 'Chưa kết nối P2P tới TV';
                statusEl.style.color = '#F43F5E';
                return;
            }

            let successCount = 0;

            for (let i = 0; i < total; i++) {
                const file = files[i];
                statusEl.textContent = `Đang nén & gửi ảnh ${i + 1}/${total}...`;

                try {
                    const compressedBase64 = await compressImage(file, 2560, 1440, 0.85);
                    activeConn.send({
                        cmd: 'SET_WALLPAPER',
                        payload: compressedBase64,
                        t: Date.now()
                    });
                    successCount++;
                    await new Promise(r => setTimeout(r, 120));
                } catch (err) {
                    console.error('Lỗi nén ảnh:', err);
                }
            }

            statusEl.textContent = `Đã gửi thành công ${successCount}/${total} ảnh lên Tivi!`;
            statusEl.style.color = '#10B981';
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            event.target.value = '';
        }

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width;
                        let h = img.height;

                        if (w > maxWidth || h > maxHeight) {
                            const ratio = Math.min(maxWidth / w, maxHeight / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.addEventListener('load', () => {
            initPeerConnection();
        });
    </script>
